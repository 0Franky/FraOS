---
# FraOS — build "prova le 3" (basi alternative). On-demand, NON sul push quotidiano,
# così non rallenta l'iterazione sulla base default (Bazzite -> build.yml).
#
# Produce i tag fraos:bluefin e fraos:rakuos. Sulla macchina, per provare:
#   sudo bootc switch ghcr.io/0franky/fraos:bluefin   # (poi reboot)
# Una sola installazione: `bootc switch` scambia l'immagine, la precedente resta come rollback.
#
#  bluefin -> Secure Boot ON  (NVIDIA-open firmato)   -> switch liscio da/verso bazzite
#  rakuos  -> Secure Boot OFF (NVIDIA unsigned, kernel CachyOS) -> richiede toggle nel BIOS
name: Build FraOS variants
on:
  # SOLO manuale (Actions -> Build FraOS variants -> Run workflow).
  # Il cron settimanale che c'era qui e' stato rimosso il 2026-08-20: contraddiceva
  # il commento qui sopra e la decisione di luglio (varianti on-demand), e ogni
  # lunedi' costruiva due immagini da ~20 GB che nessuno aveva chiesto.
  # Vedi docs/DECISIONS.md#d-030.
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: bluefin
            base_image: "ghcr.io/ublue-os/bluefin-dx-nvidia-open:stable"
          # Variante -v3: TUTTO lo userspace ricompilato per x86-64-v3 (AVX2/BMI2/FMA),
          # non solo il kernel CachyOS. E' il massimo sfruttabile dall'i7-8700K
          # (Coffee Lake): la variante -v4 richiede AVX-512, che quella CPU non ha.
          - tag: rakuos
            base_image: "quay.io/rakuos/rakuos-base-nvidia-v3:latest"

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Image Metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}.{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.description=FraOS (${{ matrix.tag }} base)
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          oci: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
